version: "3.8"

services:
  # Banco de Dados PostgreSQL de Produção
  postgres:
    image: postgres:16-alpine
    container_name: vmasys_postgres
    restart: always
    environment:
      POSTGRES_USER: vmasys
      POSTGRES_PASSWORD: vmasys_secure_password_2026
      POSTGRES_DB: vmasys_helpdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmasys -d vmasys_helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicação Web VMASYS (Next.js Standalone)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vmasys_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://vmasys:vmasys_secure_password_2026@postgres:5432/vmasys_helpdesk?schema=public"
      JWT_SECRET: "chave-secreta-jwt-super-forte-vmasys-producao-2026"
      NEXT_PUBLIC_APP_NAME: "VMASYS"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      UPLOAD_DIR: "./uploads"
      # Configurações de SMTP (Preencha com seus dados para e-mails reais)
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "VMASYS Suporte <suporte@vmasys.com.br>"
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
